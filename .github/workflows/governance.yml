name: Governance foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 resolved 2026-10-31
        with:
          persist-credentials: false
      - name: Set up the foundation runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 resolved 2026-10-31
        with:
          node-version: '24.16.0'
      - name: Test governance validators
        run: node --test scripts/governance/check-foundation.test.mjs
      - name: Check foundation and preserved references
        run: node scripts/governance/check-foundation.mjs
